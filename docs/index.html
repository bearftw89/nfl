<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --board: #E6EBF1; --panel: #FFFFFF; --panel-2: #D9E1EA; --rule: #C6D0DC;
  --ink: #1B2430; --ink-2: #536579; --on: #FFFFFF;
  --cover: #1E8C5A; --miss: #C4413E; --push: #B07A17; --idle: #8595A8; --focus: #2F6FD0;
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #1B2430; --panel: #243142; --panel-2: #2D3C50; --rule: #3A4B61;
    --ink: #E8EEF4; --ink-2: #A9B7C6; --on: #1B2430;
    --cover: #3FB27F; --miss: #E0605E; --push: #E8B04A; --idle: #5D6F86; --focus: #8CC8FF;
  }
}
:root[data-theme="dark"] {
  --board: #1B2430; --panel: #243142; --panel-2: #2D3C50; --rule: #3A4B61;
  --ink: #E8EEF4; --ink-2: #A9B7C6; --on: #1B2430;
  --cover: #3FB27F; --miss: #E0605E; --push: #E8B04A; --idle: #5D6F86; --focus: #8CC8FF;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--board); color: var(--ink); font: 400 15px/1.45 var(--text); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); border-bottom: 1px solid var(--rule); }
.top-inner, .tabs, main, .foot { max-width: 1360px; margin: 0 auto; padding: 0 16px; }
.top-inner { display: flex; align-items: center; gap: 14px; padding-top: 14px; flex-wrap: wrap; }
.brand { margin: 0; font: 700 26px/1 var(--cond); }
.league { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.league button { background: var(--panel); border: 0; padding: 6px 12px; font: 600 16px/1 var(--cond); cursor: pointer; color: var(--ink-2); }
.league button[aria-pressed="true"] { background: var(--ink); color: var(--board); }
.league[hidden] { display: none; }
.league.sub button { font-size: 14px; padding: 5px 10px; }
.league.sub button[aria-pressed="true"] { background: var(--push); color: #1B2430; }
select.week { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font: 600 18px/1 var(--cond); cursor: pointer; }
.status { margin-left: auto; color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.pulse.on { background: var(--cover); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { white-space: nowrap; flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; font: 600 17px/1 var(--cond); color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.weekbar { max-width: 1360px; margin: 0 auto; padding: 8px 16px 10px; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none; }
.weekbar::-webkit-scrollbar { display: none; }
.weekbar .wb-label { color: var(--ink-2); font: 600 14px/1 var(--cond); margin-right: 6px; flex: none; }
.weekbar button { flex: none; min-width: 34px; height: 30px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--panel); color: var(--ink); font: 600 16px/1 var(--cond); cursor: pointer; }
.weekbar button:hover:not(:disabled) { border-color: var(--ink-2); }
.weekbar button[aria-current="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.weekbar button:disabled { opacity: .35; cursor: default; }
select.week { display: none; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
.bgame { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px 12px; }
.bmeta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
.bmeta .live { color: var(--cover); font-weight: 600; }
.brow { display: grid; grid-template-columns: 44px 1fr 50px 74px 40px; align-items: center; gap: 10px; padding: 5px 0; }
.brow + .brow { border-top: 1px solid var(--rule); }
.tbadge { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 28px; border-radius: 6px;
  color: #fff; font: 700 14px/1 var(--cond); letter-spacing: .02em; }
.bname { font: 600 19px/1.1 var(--cond); }
.bname small { display: block; font: 400 12px var(--text); color: var(--ink-2); margin-top: 2px; }
.bline { font: 500 16px var(--cond); color: var(--ink-2); text-align: right; }
.bats { font: 500 14px var(--cond); color: var(--ink-2); text-align: right; white-space: nowrap; }
.bscore { font: 700 24px/1 var(--cond); text-align: right; }
.brow.lose .bname, .brow.lose .bscore { color: var(--ink-2); }
.bwin { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
@media (max-width: 560px) { .board { grid-template-columns: 1fr; } .brow { grid-template-columns: 40px 1fr 44px 66px 34px; gap: 8px; } }
main { padding-top: 18px; padding-bottom: 40px; }
.foot { color: var(--ink-2); font-size: 12px; padding-bottom: 32px; }

.strip { display: flex; flex-wrap: wrap; gap: 28px; margin: 0 0 18px; }
.strip div { display: flex; flex-direction: column; }
.strip b { font: 700 28px/1 var(--cond); }
.strip span { color: var(--ink-2); font-size: 13px; }
.five { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; align-items: center; }
.five h2 { font: 600 17px/1 var(--cond); margin: 0 6px 0 0; color: var(--ink-2); }
.sortbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; color: var(--ink-2); font-size: 13px; }
.pill { background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.game { background: var(--panel); border-radius: 10px; padding: 12px 14px 14px; border: 1px solid var(--rule); }
.game-meta { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 12px; margin-bottom: 8px; gap: 8px; }
.game-meta .live { color: var(--cover); font-weight: 600; }
.edit-btn { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.side { display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 10px; padding: 2px 0; }
.side .team { font: 600 20px/1.1 var(--cond); }
.side .team small { font: 400 12px var(--text); color: var(--ink-2); margin-left: 4px; }
.side .line { font: 500 16px var(--cond); color: var(--ink-2); min-width: 44px; text-align: right; }
.side .score { font: 700 22px/1 var(--cond); min-width: 30px; text-align: right; }
.side.st-W .team, .side.st-W .score { color: var(--cover); }
.side.st-L .team { color: var(--ink-2); }
.split { display: flex; height: 26px; margin-top: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.split > div { display: flex; align-items: center; padding: 0 8px; min-width: 0; font: 600 14px/1 var(--cond); white-space: nowrap; color: var(--on); background: var(--idle); transition: background-color .4s; }
.split > div + div { justify-content: flex-end; border-left: 2px solid var(--panel); }
.split .st-W { background: var(--cover); }
.split .st-L { background: var(--miss); }
.split .st-P, .split .st-C { background: var(--push); }
.counts { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 5px; gap: 6px; }
.editor { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
.editor label { display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); }
.editor input, .editor select { background: var(--board); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 8px; color: var(--ink); }
.editor .row { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 24px; padding: 0 6px; border-radius: 4px; font: 600 14px/1 var(--cond); background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); }
.chip.st-W { background: var(--cover); color: var(--on); border-color: var(--cover); }
.chip.st-L { background: var(--miss); color: var(--on); border-color: var(--miss); }
.chip.st-P, .chip.st-C { background: var(--push); color: var(--on); border-color: var(--push); }
.chip.live { border-style: dashed; background: transparent; }
.chip.live.st-W { color: var(--cover); } .chip.live.st-L { color: var(--miss); } .chip.live.st-P { color: var(--push); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.tools input[type="search"] { flex: 1 1 240px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
.tools label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 14px; cursor: pointer; }
.note { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; max-width: 80ch; }
.table-wrap { overflow-x: auto; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
table { width: 100%; border-collapse: collapse; min-width: 1040px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--rule); }
th { font: 600 14px/1 var(--cond); color: var(--ink-2); background: var(--panel); white-space: nowrap; }
th[data-sort] { cursor: pointer; }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--cond); font-size: 17px; }
td.place { font: 700 17px var(--cond); width: 56px; }
td.move { font: 600 13px var(--cond); width: 36px; }
td.rec { font: 500 16px var(--cond); color: var(--ink-2); white-space: nowrap; }
.up { color: var(--cover); } .down { color: var(--miss); }
td.name button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; }
td.name button:hover { text-decoration: underline; }
.picks { display: flex; gap: 3px; white-space: nowrap; }
.picks .chip { min-width: 0; padding: 0 5px; font-size: 13px; height: 22px; }
.star { background: none; border: 0; cursor: pointer; font-size: 17px; color: var(--idle); padding: 0 4px; }
.star[aria-pressed="true"] { color: var(--push); }
tr.mine td { background: color-mix(in srgb, var(--push) 10%, transparent); }
.btn { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 16px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--board); border-color: var(--ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.more { margin: 14px auto 0; display: block; }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; width: min(760px, 94vw); max-height: 88vh; overflow: auto; }
dialog .picks { flex-wrap: wrap; }
dialog table { min-width: 0; }
dialog .season td { vertical-align: middle; }
dialog::backdrop { background: rgba(10, 16, 24, .6); }
dialog h2 { font: 700 26px/1.1 var(--cond); margin: 0 0 2px; }
dialog .sub { color: var(--ink-2); margin: 0 0 14px; }
dialog ul { list-style: none; margin: 0; padding: 0; }
dialog li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
dialog li .d { color: var(--ink-2); font-size: 13px; text-align: right; }
dialog .close { float: right; }

.empty { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; color: var(--ink-2); }
.empty b { color: var(--ink); }

/* data tab */
.drop { border: 2px dashed var(--rule); border-radius: 12px; padding: 28px; text-align: center; background: var(--panel); cursor: pointer; }
.drop.over { border-color: var(--focus); }
.drop b { font: 700 22px var(--cond); display: block; margin-bottom: 4px; }
.drop span { color: var(--ink-2); font-size: 14px; }
.queue { margin: 16px 0; }
.qrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
.qrow select { background: var(--board); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px; }
.qrow .ok { color: var(--cover); } .qrow .bad { color: var(--miss); }
.have { margin-top: 26px; }
.have h2, .how h2 { font: 700 20px var(--cond); margin: 0 0 8px; }
.have table { min-width: 0; }
.how { margin-top: 26px; max-width: 72ch; }
.how p { margin: 0 0 10px; }
details.paste { margin-top: 12px; }
details.paste textarea { width: 100%; min-height: 140px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 13px; }

.cnt { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; border-radius: 4px;
  font: 600 14px/1 var(--cond); background: var(--panel-2); color: var(--ink); }
.cnt.st-W { background: var(--cover); color: var(--on); } .cnt.st-L { background: var(--miss); color: var(--on); }
.cnt.st-P, .cnt.st-C { background: var(--push); color: var(--on); } .cnt.live { outline: 1px dashed var(--ink-2); }
.wk { font: 600 13px/1 var(--cond); white-space: nowrap; }
.wk small { display: block; font: 400 11px var(--text); color: var(--ink-2); margin-top: 2px; }
.topctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.topctl input { width: 80px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; font: 600 18px var(--cond); }
.topctl label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
h2.sec { font: 700 20px var(--cond); margin: 26px 0 8px; }
td.diff { font: 600 15px var(--cond); text-align: right; }
@media (max-width: 560px) {
  .brand { font-size: 22px; }
  .status { margin-left: 0; width: 100%; }
  .games { grid-template-columns: 1fr; }
  .strip { gap: 18px; }
  .qrow { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .pulse.on { animation: none; } .split > div { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">Contest Board</h1>
    <div class="league" role="group" aria-label="Contest">
      <button data-league="nfl-group">NFL</button><button data-league="ncaaf">NCAAF</button><button data-league="survivor">Survivor</button>
    </div>
    <div class="league sub" id="nflsub" role="group" aria-label="NFL contest">
      <button data-league="nfl">SuperContest</button><button data-league="gold">Gold</button>
    </div>
    <label><span class="sr">Week</span><select class="week" id="week"></select></label>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="board" aria-selected="false">Scoreboard</button>
    <button role="tab" data-tab="games" aria-selected="true">Picks by game</button>
    <button role="tab" data-tab="standings" aria-selected="false">Standings</button>
    <button role="tab" data-tab="teams" aria-selected="false">Consensus</button>
    <button role="tab" data-tab="ats" aria-selected="false">Teams ATS</button>
    <button role="tab" data-tab="top" aria-selected="false">Top entries</button>
    <button role="tab" data-tab="svweek" aria-selected="false">This week</button>
    <button role="tab" data-tab="sventries" aria-selected="false">Entries</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>
  <nav class="weekbar" id="weekbar" aria-label="Week"></nav>
</header>
<main id="main">
  <section id="board" class="view" hidden></section>
  <section id="games" class="view"></section>
  <section id="standings" class="view" hidden></section>
  <section id="teams" class="view" hidden></section>
  <section id="ats" class="view" hidden></section>
  <section id="top" class="view" hidden></section>
  <section id="svweek" class="view" hidden></section>
  <section id="sventries" class="view" hidden></section>
  <section id="data" class="view" hidden></section>
</main>
<dialog id="entry"></dialog>
<footer class="foot" id="foot">Lines, picks and official standings: Westgate SuperContest PDFs. Scores: ESPN. Graded against the static Westgate SuperContest line: cover 1, push ½, loss 0; rule 22 postponements ½. Live standings are unofficial until Westgate posts them.</footer>

<script>
(() => {
"use strict";

/* ================= teams ================= */
const TEAMS = { BILLS:"BUF", DOLPHINS:"MIA", PATRIOTS:"NE", JETS:"NYJ", RAVENS:"BAL", BENGALS:"CIN", BROWNS:"CLE",
  STEELERS:"PIT", TEXANS:"HOU", COLTS:"IND", JAGUARS:"JAX", JAGS:"JAX", TITANS:"TEN", BRONCOS:"DEN", CHIEFS:"KC",
  RAIDERS:"LV", CHARGERS:"LAC", COWBOYS:"DAL", GIANTS:"NYG", EAGLES:"PHI", COMMANDERS:"WSH", BEARS:"CHI", LIONS:"DET",
  PACKERS:"GB", VIKINGS:"MIN", FALCONS:"ATL", PANTHERS:"CAR", SAINTS:"NO", BUCCANEERS:"TB", BUCS:"TB", CARDINALS:"ARI",
  RAMS:"LAR", "49ERS":"SF", NINERS:"SF", SEAHAWKS:"SEA" };
const NICK = { BUF:"Bills", MIA:"Dolphins", NE:"Patriots", NYJ:"Jets", BAL:"Ravens", CIN:"Bengals", CLE:"Browns",
  PIT:"Steelers", HOU:"Texans", IND:"Colts", JAX:"Jaguars", TEN:"Titans", DEN:"Broncos", KC:"Chiefs", LV:"Raiders",
  LAC:"Chargers", DAL:"Cowboys", NYG:"Giants", PHI:"Eagles", WSH:"Commanders", CHI:"Bears", DET:"Lions", GB:"Packers",
  MIN:"Vikings", ATL:"Falcons", CAR:"Panthers", NO:"Saints", TB:"Buccaneers", ARI:"Cardinals", LAR:"Rams", SF:"49ers", SEA:"Seahawks" };
const ABBR_FIX = { WAS: "WSH", LA: "LAR", JAC: "JAX" };
const fixAbbr = a => ABBR_FIX[a] || a;
// College teams are keyed by their game-sheet name ("NORTH CAROLINA"); LABELS holds Westgate's short
// form from the selections sheet ("N CAROLINA"). NFL teams are keyed by ESPN code.
const LABELS = {};
const isCollege = () => S.league === "ncaaf";
const isSurvivor = () => S.league === "survivor";
const LEAGUES = ["nfl", "gold", "ncaaf", "survivor"];
const LEAGUE_NAME = { nfl: "SuperContest (NFL)", gold: "SuperContest Gold (NFL)", ncaaf: "SuperContest College", survivor: "SuperContest Survivor" };
const lbl = ab => isCollege() ? (LABELS[ab] || ab) : ab;
const titleCase = s => s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Lsu|Ucla|Usc|Tcu|Smu|Byu|Utep|Utsa|Uab|Unlv|Ucf|Ul|Nc)\b/g, m => m.toUpperCase());
const squash = x => x.replace(/[^A-Z0-9]/g, "");
const nickOf = ab => isCollege() ? (LABELS[ab] && squash(LABELS[ab]) !== squash(ab) ? titleCase(ab) : "") : (NICK[ab] || "");
const toAbbr = n => TEAMS[String(n).trim().toUpperCase().replace(/\*$/, "")] || null;

/* ================= parsers (same rules as the GitHub version) ================= */
// Anchored per line with spaces only, so a date header ending in "2026" can't glue onto
// the next game row (that bug dropped the first game of each day). "@ Melbourne..." notes are skipped.
const CARD_RE = /^[ \t]*(\d{1,3})[ \t]+([A-Z0-9][A-Z0-9 .']*?)(\*?)[ \t]+(?:@[^\n]*?[ \t]+)?(\d{1,2}:\d{2}[ \t]*[AP]M)[ \t]+(\d{1,3})[ \t]+([A-Z0-9][A-Z0-9 .']*?)(\*?)[ \t]+([+-]?\d+(?:\.\d+)?|PK|P)\b/gm;
function parseCard(text) {
  const games = [];
  for (const m of text.toUpperCase().matchAll(CARD_RE)) {
    const a1 = toAbbr(m[2]), a2 = toAbbr(m[6]);
    if (!a1 || !a2) continue;
    const dog = (m[8] === "PK" || m[8] === "P") ? 0 : Math.abs(parseFloat(m[8]));
    games.push({ id: games.length + 1, time_pt: m[4],
      fav: { num: +m[1], abbr: a1, home: !!m[3], line: dog ? -dog : 0 },
      dog: { num: +m[5], abbr: a2, home: !!m[7], line: dog } });
  }
  return games;
}
const ENTRY_RE = /^(.+?)\s+-\s+(\d{1,2})\s+(.+)$/;
function parseSelections(text) {
  const out = [], seen = new Set();

// Straight-up result for a picked team in week w, from the same NFL scores as the main contest.
function survResult(w, t) {
  const g = scoresMap(w)[t];
  if (!g || g.state === "pre" || g.home_score == null || g.away_score == null) return { st: "pre", g };
  const mine = g.home === t ? g.home_score : g.away_score, theirs = g.home === t ? g.away_score : g.home_score;
  return { st: g.state === "post" ? "final" : "live", r: mine > theirs ? "W" : mine < theirs ? "L" : "T", mine, theirs, g };
}
// Walk the season: a loss, a tie or a missing pick eliminates; each team once.
function survState(W) {
  const weeks = weeksList().filter(w => w <= W && index().weeks[w]?.picks);
  const st = {};
  weeks.forEach((w, i) => {
    const picks = Object.fromEntries((Store.get(P.picks(w))?.entries || []).map(e => [e.id, e.pick]));
    if (i === 0) for (const id of Object.keys(picks)) st[id] = { id, alive: true, out: null, reason: null, used: [] };
    for (const s of Object.values(st)) {
      if (!s.alive) continue;
      const t = picks[s.id];
      if (!t) { s.alive = false; s.out = w; s.reason = "No pick"; continue; }
      const res = survResult(w, t), dup = s.used.some(u => u.t === t);
      s.used.push({ w, t, res });
      if (dup) { s.alive = false; s.out = w; s.reason = `${t} already used`; }
      else if (res.st === "final" && res.r !== "W") { s.alive = false; s.out = w; s.reason = `${t} ${res.r === "T" ? "tied" : "lost"}`; }
    }
  });
  return { st, weeks };
}

}

      ${list.map(s => {
        const cur = s.used.find(u => u.w === W);
        const stat = s.alive ? `<span class="up">Alive</span>` : `<span class="down">Out week ${s.out}</span> <small class="note">${esc(s.reason || "")}</small>`;
        return `<tr><td class="name"><b>${esc(s.id)}</b></td><td>${stat}</td><td>${cur ? survChip(cur) : `<span class="note">—</span>`}</td>
          <td><div class="picks">${s.used.map(u => survChip(u, true)).join("")}</div></td><td class="num">${32 - s.used.length}</td></tr>`;
      }).join("")}
    </tbody></table></div>`;
}

/* ================= render: scoreboard ================= */
// Team-color badges with the abbreviation (colors only; no team artwork).
const TEAM_COLORS = { ARI:"#97233F", ATL:"#A71930", BAL:"#241773", BUF:"#00338D", CAR:"#0085CA", CHI:"#0B162A", CIN:"#FB4F14",
  CLE:"#311D00", DAL:"#041E42", DEN:"#FB4F14", DET:"#0076B6", GB:"#203731", HOU:"#03202F", IND:"#002C5F", JAX:"#006778",
  KC:"#E31837", LV:"#000000", LAC:"#0080C6", LAR:"#003594", MIA:"#008E97", MIN:"#4F2683", NE:"#002244", NO:"#101820",
  NYG:"#0B2265", NYJ:"#125740", PHI:"#004C54", PIT:"#101820", SF:"#AA0000", SEA:"#002244", TB:"#D50A0A", TEN:"#0C2340", WSH:"#5A1414" };
const tLabel = ab => typeof lbl === "function" ? lbl(ab) : ab;
const tNick = ab => typeof nickOf === "function" ? nickOf(ab) : (NICK[ab] || "");
const teamBadge = ab => `<span class="tbadge" style="background:${TEAM_COLORS[ab] || "var(--idle)"}" aria-hidden="true">${esc(tLabel(ab))}</span>`;
// Each team's ATS record from every final game through week W.
function atsThrough(W) {
  const rec = {};
  for (const w of weeksList().filter(w => w <= W && index().weeks[w]?.card)) {
    const g = weekGrades(w); if (!g) continue;
    for (const gm of g.card) for (const side of [gm.fav, gm.dog]) {
      const r = rec[side.abbr] ||= { w: 0, l: 0, p: 0 };
      const gr = grade(side.abbr, g.card, g.scores, g.ov);
      if (gr.final && gr.res) gr.res === "W" ? r.w++ : gr.res === "L" ? r.l++ : r.p++;
    }
  }
  return rec;
}
function renderBoard() {
  const el = $("#board"), W = S.week;
  if (!seasonReady(["card", "scores"], W)) { el.innerHTML = `<p class="note">Loading the scoreboard…</p>`; return; }
  const g = weekGrades(W);
  if (!g) { el.innerHTML = `<div class="empty"><b>No game sheet for week ${W} yet.</b></div>`; return; }
  const rec = atsThrough(W);
  const cnt = {}; (Store.get(P.picks(W))?.entries || []).forEach(e => e.picks.forEach(a => cnt[a] = (cnt[a] || 0) + 1));
  const games = g.card.map(gm => ({ gm, sg: g.scores[gm.fav.abbr] }))
    .sort((a, b) => (a.sg?.kickoff || "").localeCompare(b.sg?.kickoff || "") || a.gm.id - b.gm.id);
  const recTxt = ab => { const r = rec[ab] || { w: 0, l: 0, p: 0 }; return `ATS ${r.w}-${r.l}${r.p ? "-" + r.p : ""}`; };
  el.innerHTML = `<p class="note">Week ${W}, in kickoff order. Lines are the Westgate contest lines; ATS records count final games through week ${W}.</p>
    <div class="board">${games.map(({ gm, sg }) => {
      const neutral = !gm.fav.home && !gm.dog.home;
      const home = gm.fav.home ? gm.fav : gm.dog, away = home === gm.fav ? gm.dog : gm.fav;
      const fg = grade(gm.fav.abbr, g.card, g.scores, g.ov);
      const started = sg && sg.state !== "pre" && sg.home_score != null;
      const score = s => started ? (sg.home === s.abbr ? sg.home_score : sg.away_score) : "";
      const lead = started && sg.state === "post" ? (score(home) > score(away) ? home.abbr : score(away) > score(home) ? away.abbr : null) : null;
      const row = (s, where) => `<div class="brow ${lead && lead !== s.abbr ? "lose" : ""}">
          ${teamBadge(s.abbr)}
          <div class="bname">${esc(tLabel(s.abbr))} ${tNick(s.abbr) ? `<small>${esc(tNick(s.abbr))}${where ? " · " + where : ""}</small>` : `<small>${where}</small>`}</div>
          <div class="bline">${fmtLine(s.line)}</div><div class="bats">${recTxt(s.abbr)}</div><div class="bscore">${score(s)}</div></div>`;
      const meta = !sg ? esc(kickoffLabel(null, gm)) : sg.state === "in" ? `<span class="live">${esc(sg.detail || "In progress")}</span>`
        : sg.state === "post" ? esc(sg.detail || "Final") : esc(kickoffLabel(sg, gm));
      const winner = fg.res === "W" ? gm.fav : fg.res === "L" ? gm.dog : null;
      const ats = !fg.res ? `<span>ATS winner: not started</span>`
        : fg.res === "P" || fg.res === "C" ? `<span class="chip st-P${fg.final ? "" : " live"}">${fg.res === "C" ? "Not played: ½ pt each" : fg.final ? "ATS push" : "On the number"}</span>`
        : `<span class="chip st-W${fg.final ? "" : " live"}">${fg.final ? "ATS winner" : "Covering"}: ${esc(tLabel(winner.abbr))} ${fmtLine(winner.line)}</span>`;
      return `<article class="bgame"><div class="bmeta"><span>${neutral ? "Neutral site" : "#" + away.num + " at #" + home.num}</span>${meta}</div>
        ${row(away, neutral ? "Neutral" : "Away")}${row(home, neutral ? "Neutral" : "Home")}
        <div class="bwin">${ats}<span>Picks: ${cnt[away.abbr] || 0} ${esc(tLabel(away.abbr))} / ${cnt[home.abbr] || 0} ${esc(tLabel(home.abbr))}</span></div></article>`;
    }).join("")}</div>`;
}

function bind() {
  document.getElementById("weekbar").addEventListener("click", e => {
    const b = e.target.closest("[data-goweek]"); if (!b || b.disabled) return;
    const sel = $("#week"); sel.value = b.dataset.goweek; sel.dispatchEvent(new Event("change"));
  });
  document.querySelectorAll(".league").forEach(g => g.addEventListener("click", e => { const b = e.target.closest("[data-league]"); if (b) switchLeague(b.dataset.league); }));
  $("#week").addEventListener("change", e => { S.week = +e.target.value; S.shown = 150; onIndex(); setTimeout(scheduleRefresh, 1500); });
  document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { S.tab = b.dataset.tab; render(); } });
  const main = $("#main");
  main.addEventListener("click", e => {
    const t = e.target, c = s => t.closest(s);
    if (c("[data-gsort]")) { S.gameSort = c("[data-gsort]").dataset.gsort; render(); }
    else if (c("[data-star]")) { const id = c("[data-star]").dataset.star; S.starred.has(id) ? S.starred.delete(id) : S.starred.add(id); local.set("cb-starred", [...S.starred]); render(); }
    else if (c("[data-entry]")) openEntry(c("[data-entry]").dataset.entry);
    else if (c("[data-team]")) openTeam(c("[data-team]").dataset.team);
    else if (c("[data-atssort]")) { const k = c("[data-atssort]").dataset.atssort; S.atsDir = (S.atsSort || "pct") === k ? -(S.atsDir || 1) : (k === "team" ? -1 : 1); S.atsSort = k; render(); }
    else if (c("[data-topn]")) { S.topN = +c("[data-topn]").dataset.topn; local.set("cb-topn", S.topN); render(); }
    else if (c("[data-topteam]")) openTopTeam(c("[data-topteam]").dataset.topteam);
    else if (c("th[data-sort]")) {
      const k = c("th[data-sort]").dataset.sort;
      if (S.sortKey === k) S.sortDir = -S.sortDir; else { S.sortKey = k; S.sortDir = k === "name" ? 1 : -1; }
      render();
    }
    else if (t.id === "more") { S.shown = Infinity; render(); }
  });
  main.addEventListener("input", e => {
    if (e.target.id === "topN") {
      const v = parseInt(e.target.value, 10);
      if (v > 0) { S.topN = v; local.set("cb-topn", v); clearTimeout(S.tnT); S.tnT = setTimeout(() => { render(); requestAnimationFrame(() => { const i = $("#topN"); if (i) { i.focus(); const l = i.value.length; try { i.setSelectionRange(l, l); } catch {} } }); }, 350); }
      return;
    }
    if (e.target.id === "q") { S.q = e.target.value; S.shown = 150; clearTimeout(S.qT); S.qT = setTimeout(render, 150); } });
  main.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "onlyStar") { S.onlyStarred = t.checked; render(); }
    else if (t.id === "svAlive") { S.svAlive = t.checked; render(); }
    else if (t.id === "topTies") { S.topTies = t.checked; render(); }
    else if (t.id === "topBasis") { S.topBasis = t.value; render(); }
  });
  $("#entry").addEventListener("click", e => {
    const en = e.target.closest("[data-entry]");
    if (en) { $("#entry").close(); openEntry(en.dataset.entry); return; }
    if (e.target.matches("[data-close]") || e.target === $("#entry")) $("#entry").close();
  });
}

bind();
renderStatus();
markLeague();
Store.init().then(() => { Store.watch(P.index, onIndex); setTimeout(scheduleRefresh, 3000); });
})();
</script>
</body>
</html>
