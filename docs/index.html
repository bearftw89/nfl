<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --board: #E6EBF1; --panel: #FFFFFF; --panel-2: #D9E1EA; --rule: #C6D0DC;
  --ink: #1B2430; --ink-2: #536579; --on: #FFFFFF;
  --cover: #1E8C5A; --miss: #C4413E; --push: #B07A17; --idle: #8595A8; --focus: #2F6FD0;
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #1B2430; --panel: #243142; --panel-2: #2D3C50; --rule: #3A4B61;
    --ink: #E8EEF4; --ink-2: #A9B7C6; --on: #1B2430;
    --cover: #3FB27F; --miss: #E0605E; --push: #E8B04A; --idle: #5D6F86; --focus: #8CC8FF;
  }
}
:root[data-theme="dark"] {
  --board: #1B2430; --panel: #243142; --panel-2: #2D3C50; --rule: #3A4B61;
  --ink: #E8EEF4; --ink-2: #A9B7C6; --on: #1B2430;
  --cover: #3FB27F; --miss: #E0605E; --push: #E8B04A; --idle: #5D6F86; --focus: #8CC8FF;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--board); color: var(--ink); font: 400 15px/1.45 var(--text); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); border-bottom: 1px solid var(--rule); }
.top-inner, .tabs, main, .foot { max-width: 1360px; margin: 0 auto; padding: 0 16px; }
.top-inner { display: flex; align-items: center; gap: 14px; padding-top: 14px; flex-wrap: wrap; }
.brand { margin: 0; font: 700 26px/1 var(--cond); }
.league { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.league button { background: var(--panel); border: 0; padding: 6px 12px; font: 600 16px/1 var(--cond); cursor: pointer; color: var(--ink-2); }
.league button[aria-pressed="true"] { background: var(--ink); color: var(--board); }
select.week { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font: 600 18px/1 var(--cond); cursor: pointer; }
.status { margin-left: auto; color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.pulse.on { background: var(--cover); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { white-space: nowrap; flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; font: 600 17px/1 var(--cond); color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
main { padding-top: 18px; padding-bottom: 40px; }
.foot { color: var(--ink-2); font-size: 12px; padding-bottom: 32px; }

.strip { display: flex; flex-wrap: wrap; gap: 28px; margin: 0 0 18px; }
.strip div { display: flex; flex-direction: column; }
.strip b { font: 700 28px/1 var(--cond); }
.strip span { color: var(--ink-2); font-size: 13px; }
.five { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; align-items: center; }
.five h2 { font: 600 17px/1 var(--cond); margin: 0 6px 0 0; color: var(--ink-2); }
.sortbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; color: var(--ink-2); font-size: 13px; }
.pill { background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.game { background: var(--panel); border-radius: 10px; padding: 12px 14px 14px; border: 1px solid var(--rule); }
.game-meta { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 12px; margin-bottom: 8px; gap: 8px; }
.game-meta .live { color: var(--cover); font-weight: 600; }
.edit-btn { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.side { display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 10px; padding: 2px 0; }
.side .team { font: 600 20px/1.1 var(--cond); }
.side .team small { font: 400 12px var(--text); color: var(--ink-2); margin-left: 4px; }
.side .line { font: 500 16px var(--cond); color: var(--ink-2); min-width: 44px; text-align: right; }
.side .score { font: 700 22px/1 var(--cond); min-width: 30px; text-align: right; }
.side.st-W .team, .side.st-W .score { color: var(--cover); }
.side.st-L .team { color: var(--ink-2); }
.split { display: flex; height: 26px; margin-top: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.split > div { display: flex; align-items: center; padding: 0 8px; min-width: 0; font: 600 14px/1 var(--cond); white-space: nowrap; color: var(--on); background: var(--idle); transition: background-color .4s; }
.split > div + div { justify-content: flex-end; border-left: 2px solid var(--panel); }
.split .st-W { background: var(--cover); }
.split .st-L { background: var(--miss); }
.split .st-P, .split .st-C { background: var(--push); }
.counts { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 5px; gap: 6px; }
.editor { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
.editor label { display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); }
.editor input, .editor select { background: var(--board); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 8px; color: var(--ink); }
.editor .row { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 24px; padding: 0 6px; border-radius: 4px; font: 600 14px/1 var(--cond); background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); }
.chip.st-W { background: var(--cover); color: var(--on); border-color: var(--cover); }
.chip.st-L { background: var(--miss); color: var(--on); border-color: var(--miss); }
.chip.st-P, .chip.st-C { background: var(--push); color: var(--on); border-color: var(--push); }
.chip.live { border-style: dashed; background: transparent; }
.chip.live.st-W { color: var(--cover); } .chip.live.st-L { color: var(--miss); } .chip.live.st-P { color: var(--push); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.tools input[type="search"] { flex: 1 1 240px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
.tools label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 14px; cursor: pointer; }
.note { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; max-width: 80ch; }
.table-wrap { overflow-x: auto; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
table { width: 100%; border-collapse: collapse; min-width: 1040px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--rule); }
th { font: 600 14px/1 var(--cond); color: var(--ink-2); background: var(--panel); white-space: nowrap; }
th[data-sort] { cursor: pointer; }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--cond); font-size: 17px; }
td.place { font: 700 17px var(--cond); width: 56px; }
td.move { font: 600 13px var(--cond); width: 36px; }
td.rec { font: 500 16px var(--cond); color: var(--ink-2); white-space: nowrap; }
.up { color: var(--cover); } .down { color: var(--miss); }
td.name button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; }
td.name button:hover { text-decoration: underline; }
.picks { display: flex; gap: 3px; white-space: nowrap; }
.picks .chip { min-width: 0; padding: 0 5px; font-size: 13px; height: 22px; }
.star { background: none; border: 0; cursor: pointer; font-size: 17px; color: var(--idle); padding: 0 4px; }
.star[aria-pressed="true"] { color: var(--push); }
tr.mine td { background: color-mix(in srgb, var(--push) 10%, transparent); }
.btn { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 16px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--board); border-color: var(--ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.more { margin: 14px auto 0; display: block; }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; width: min(470px, 92vw); }
dialog::backdrop { background: rgba(10, 16, 24, .6); }
dialog h2 { font: 700 26px/1.1 var(--cond); margin: 0 0 2px; }
dialog .sub { color: var(--ink-2); margin: 0 0 14px; }
dialog ul { list-style: none; margin: 0; padding: 0; }
dialog li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
dialog li .d { color: var(--ink-2); font-size: 13px; text-align: right; }
dialog .close { float: right; }

.empty { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; color: var(--ink-2); }
.empty b { color: var(--ink); }

/* data tab */
.drop { border: 2px dashed var(--rule); border-radius: 12px; padding: 28px; text-align: center; background: var(--panel); cursor: pointer; }
.drop.over { border-color: var(--focus); }
.drop b { font: 700 22px var(--cond); display: block; margin-bottom: 4px; }
.drop span { color: var(--ink-2); font-size: 14px; }
.queue { margin: 16px 0; }
.qrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
.qrow select { background: var(--board); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px; }
.qrow .ok { color: var(--cover); } .qrow .bad { color: var(--miss); }
.have { margin-top: 26px; }
.have h2, .how h2 { font: 700 20px var(--cond); margin: 0 0 8px; }
.have table { min-width: 0; }
.how { margin-top: 26px; max-width: 72ch; }
.how p { margin: 0 0 10px; }
details.paste { margin-top: 12px; }
details.paste textarea { width: 100%; min-height: 140px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 13px; }

.cnt { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; border-radius: 4px;
  font: 600 14px/1 var(--cond); background: var(--panel-2); color: var(--ink); }
.cnt.st-W { background: var(--cover); color: var(--on); } .cnt.st-L { background: var(--miss); color: var(--on); }
.cnt.st-P, .cnt.st-C { background: var(--push); color: var(--on); } .cnt.live { outline: 1px dashed var(--ink-2); }
.wk { font: 600 13px/1 var(--cond); white-space: nowrap; }
.wk small { display: block; font: 400 11px var(--text); color: var(--ink-2); margin-top: 2px; }
.topctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.topctl input { width: 80px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; font: 600 18px var(--cond); }
.topctl label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
h2.sec { font: 700 20px var(--cond); margin: 26px 0 8px; }
td.diff { font: 600 15px var(--cond); text-align: right; }
@media (max-width: 560px) {
  .brand { font-size: 22px; }
  .status { margin-left: 0; width: 100%; }
  .games { grid-template-columns: 1fr; }
  .strip { gap: 18px; }
  .qrow { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .pulse.on { animation: none; } .split > div { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">Contest Board</h1>
    <div class="league" role="group" aria-label="Contest">
      <button data-league="nfl">NFL</button><button data-league="ncaaf">NCAAF</button>
    </div>
    <label><span class="sr">Week</span><select class="week" id="week"></select></label>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="games" aria-selected="true">Picks by game</button>
    <button role="tab" data-tab="standings" aria-selected="false">Standings</button>
    <button role="tab" data-tab="teams" aria-selected="false">Consensus</button>
    <button role="tab" data-tab="ats" aria-selected="false">Teams ATS</button>
    <button role="tab" data-tab="top" aria-selected="false">Top entries</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>
</header>
<main id="main">
  <section id="games" class="view"></section>
  <section id="standings" class="view" hidden></section>
  <section id="teams" class="view" hidden></section>
  <section id="ats" class="view" hidden></section>
  <section id="top" class="view" hidden></section>
  <section id="data" class="view" hidden></section>
</main>
<dialog id="entry"></dialog>
<footer class="foot">Lines, picks and official standings: Westgate SuperContest PDFs. Scores: ESPN. Graded against the static Westgate SuperContest line: cover 1, push ½, loss 0; rule 22 postponements ½. Live standings are unofficial until Westgate posts them.</footer>

<script>
(() => {
"use strict";

/* ================= teams ================= */
const TEAMS = { BILLS:"BUF", DOLPHINS:"MIA", PATRIOTS:"NE", JETS:"NYJ", RAVENS:"BAL", BENGALS:"CIN", BROWNS:"CLE",
  STEELERS:"PIT", TEXANS:"HOU", COLTS:"IND", JAGUARS:"JAX", JAGS:"JAX", TITANS:"TEN", BRONCOS:"DEN", CHIEFS:"KC",
  RAIDERS:"LV", CHARGERS:"LAC", COWBOYS:"DAL", GIANTS:"NYG", EAGLES:"PHI", COMMANDERS:"WSH", BEARS:"CHI", LIONS:"DET",
  PACKERS:"GB", VIKINGS:"MIN", FALCONS:"ATL", PANTHERS:"CAR", SAINTS:"NO", BUCCANEERS:"TB", BUCS:"TB", CARDINALS:"ARI",
  RAMS:"LAR", "49ERS":"SF", NINERS:"SF", SEAHAWKS:"SEA" };
const NICK = { BUF:"Bills", MIA:"Dolphins", NE:"Patriots", NYJ:"Jets", BAL:"Ravens", CIN:"Bengals", CLE:"Browns",
  PIT:"Steelers", HOU:"Texans", IND:"Colts", JAX:"Jaguars", TEN:"Titans", DEN:"Broncos", KC:"Chiefs", LV:"Raiders",
  LAC:"Chargers", DAL:"Cowboys", NYG:"Giants", PHI:"Eagles", WSH:"Commanders", CHI:"Bears", DET:"Lions", GB:"Packers",
  MIN:"Vikings", ATL:"Falcons", CAR:"Panthers", NO:"Saints", TB:"Buccaneers", ARI:"Cardinals", LAR:"Rams", SF:"49ers", SEA:"Seahawks" };
const ABBR_FIX = { WAS: "WSH", LA: "LAR", JAC: "JAX" };
const fixAbbr = a => ABBR_FIX[a] || a;
// College teams are keyed by their game-sheet name ("NORTH CAROLINA"); LABELS holds Westgate's short
// form from the selections sheet ("N CAROLINA"). NFL teams are keyed by ESPN code.
const LABELS = {};
const isCollege = () => S.league === "ncaaf";
const lbl = ab => isCollege() ? (LABELS[ab] || ab) : ab;
const titleCase = s => s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Lsu|Ucla|Usc|Tcu|Smu|Byu|Utep|Utsa|Uab|Unlv|Ucf|Ul|Nc)\b/g, m => m.toUpperCase());
const squash = x => x.replace(/[^A-Z0-9]/g, "");
const nickOf = ab => isCollege() ? (LABELS[ab] && squash(LABELS[ab]) !== squash(ab) ? titleCase(ab) : "") : (NICK[ab] || "");
const toAbbr = n => TEAMS[String(n).trim().toUpperCase().replace(/\*$/, "")] || null;

/* ================= parsers (same rules as the GitHub version) ================= */
// Anchored per line with spaces only, so a date header ending in "2026" can't glue onto
// the next game row (that bug dropped the first game of each day). "@ Melbourne..." notes are skipped.
const CARD_RE = /^[ \t]*(\d{1,3})[ \t]+([A-Z0-9][A-Z0-9 .']*?)(\*?)[ \t]+(?:@[^\n]*?[ \t]+)?(\d{1,2}:\d{2}[ \t]*[AP]M)[ \t]+(\d{1,3})[ \t]+([A-Z0-9][A-Z0-9 .']*?)(\*?)[ \t]+([+-]?\d+(?:\.\d+)?|PK|P)\b/gm;
function parseCard(text) {
  const games = [];
  for (const m of text.toUpperCase().matchAll(CARD_RE)) {
    const a1 = toAbbr(m[2]), a2 = toAbbr(m[6]);
    if (!a1 || !a2) continue;
    const dog = (m[8] === "PK" || m[8] === "P") ? 0 : Math.abs(parseFloat(m[8]));
    games.push({ id: games.length + 1, time_pt: m[4],
      fav: { num: +m[1], abbr: a1, home: !!m[3], line: dog ? -dog : 0 },
      dog: { num: +m[5], abbr: a2, home: !!m[7], line: dog } });
  }
  return games;
}
const ENTRY_RE = /^(.+?)\s+-\s+(\d{1,2})\s+(.+)$/;
function parseSelections(text) {
  const out = [], seen = new Set();
  for (const raw of text.split("\n")) {
    const m = raw.trim().toUpperCase().match(ENTRY_RE);
    if (!m) continue;
    const picks = m[3].split(/\s+/).map(toAbbr);
    if (!picks.length || picks.some(p => !p)) continue;
    const id = `${m[1].trim()}-${+m[2]}`;
    if (seen.has(id)) continue;           // rule 15: first submission counts
    seen.add(id); out.push({ id, picks });
  }
  return out;
}
const STAND_RE = /^(\d+T?)\s+(.+-\d{1,2})\s+(\d+)-(\d+)-(\d+)-(\d+)\s+(\d+(?:\.\d+)?)$/;
function parseStandings(text) {
  const rows = [];
  for (const raw of text.split("\n")) {
    const m = raw.trim().toUpperCase().match(STAND_RE);
    if (m) rows.push({ place: m[1], id: m[2].trim(), w: +m[3], l: +m[4], t: +m[5], c: +m[6], pts: +m[7] });
  }
  return rows;
}
const MIN_ROWS = { card: 8, picks: 20, standings: 20 };
function detect(text, filename) {
  const res = { card: parseCard(text), picks: parseSelections(text), standings: parseStandings(text) };
  let kind = null, best = 0;
  for (const k of Object.keys(res)) if (res[k].length >= MIN_ROWS[k] && res[k].length > best) { kind = k; best = res[k].length; }
  const wk = (text.match(/WEEK\s*#?\s*(\d{1,2})/i) || filename.match(/(?:WEEK|WK)\s*#?\s*(\d{1,2})/i) || [])[1];
  return { kind, week: wk ? +wk : null, rows: res };
}

/* PDFs are read by the scraper (scraper/parse.py), not in the browser. */

/* ================= data: scraper JSON + live ESPN scores ================= */
const DATA = "data/";
const ESPN_URL = (season, week) =>
  `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${season}`;
async function getJSON(url, ms = 10000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal, cache: "no-store" }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function espnGames(data) {
  const out = [];
  for (const ev of data.events || []) {
    const comp = ev.competitions[0], st = (comp.status || ev.status).type;
    const g = { kickoff: ev.date, state: st.state, detail: st.shortDetail, status: st.name };
    for (const c of comp.competitors) {
      g[c.homeAway] = c.team.abbreviation;
      g[c.homeAway + "_score"] = c.score === "" || c.score == null ? null : Number(c.score);
    }
    out.push(g);
  }
  return out;
}
async function loadScores(w) {
  const m = Store.manifest.weeks[w] || {}, base = `${Store.base()}week-${w}/`;
  const ovDoc = m.overrides ? await getJSON(base + "overrides.json").catch(() => null) : null;
  // "official" = covers confirmed from Westgate's standings; manual "results" win over everything
  const ov = { ...(ovDoc?.official || {}), ...(ovDoc?.results || {}) }, manual = ovDoc?.results || {};
  if (isCollege()) return { ...(await loadCollegeScores(w, m, base, ov)), manual };
  const saved = m.results ? await getJSON(base + "results.json").catch(() => null) : null;
  const allFinal = saved?.games?.length && saved.games.every(g => g.state === "post" && !/POSTPONED|CANCEL|SUSPENDED/i.test(g.status || ""));
  let games, source;
  if (allFinal) { games = saved.games; source = "final"; }
  else {
    try { games = espnGames(await getJSON(ESPN_URL(Store.season, w), 8000)); source = "espn"; }
    catch { games = saved?.games || []; source = saved ? "snapshot" : "none"; }
  }
  const map = {};

/* ================= render: pick totals ================= */
const RESULT_TEXT = { W: "Covered", L: "Lost", P: "Push", C: "\u00bd pt (rule 22)" };
function renderTeams() {
  const el = $("#teams"), w = S.week;
  const card = Store.get(P.card(w))?.games;
  const picks = Store.get(P.picks(w))?.entries || [];
  if (!card || !picks.length) {
    el.innerHTML = `<div class="empty"><b>Nothing to total yet.</b> This tab needs both the game sheet and the selections for week ${w}.</div>`;
    return;
  }
  const scores = scoresMap(w), ov = Store.get(P.scores(w))?.overrides || {};
  const by = {};
  picks.forEach(e => e.picks.forEach(a => (by[a] ||= []).push(e.id)));
  const rows = [];
  for (const g of card) for (const side of [g.fav, g.dog]) {
    const gr = grade(side.abbr, card, scores, ov), other = side === g.fav ? g.dog : g.fav;
    const who = by[side.abbr] || [];
    const pts = !gr.res ? null : gr.res === "W" ? who.length : (gr.res === "P" || gr.res === "C") ? who.length / 2 : 0;
    rows.push({ abbr: side.abbr, line: side.line, opp: other.abbr, home: side.home, gr, who, pts, sg: gr.sg });
  }
  rows.sort((a, b) => b.who.length - a.who.length || a.abbr.localeCompare(b.abbr));
  const n = picks.length;
  const tally = k => rows.filter(r => r.gr.final && r.gr.res === k).reduce((s, r) => s + r.who.length, 0);
  const live = rows.filter(r => r.gr.live).reduce((s, r) => s + r.who.length, 0);
  const cell = r => {
    const st = !r.gr.res ? (r.gr.postponed ? "Postponed" : kickoffLabel(r.sg, r.gr.game) || "Not started")
      : r.gr.final ? RESULT_TEXT[r.gr.res] : { W: "Covering", L: "Not covering", P: "On the number" }[r.gr.res];
    const cls = r.gr.res ? `st-${r.gr.res}` : "";
    const score = r.sg && r.sg.state !== "pre" && r.sg.home_score != null
      ? `${r.sg.home === r.abbr ? r.sg.home_score : r.sg.away_score}\u2013${r.sg.home === r.abbr ? r.sg.away_score : r.sg.home_score}` : "";
    return `<td class="rec">${score}</td><td><span class="chip ${cls}${r.gr.final || !r.gr.res ? "" : " live"}">${st}</span>
      ${r.gr.live ? `<small class="note"> ${esc(r.sg.detail || "")}</small>` : ""}</td>`;
  };
  el.innerHTML = `
    <div class="strip">
      <div><b>${n}</b><span>entries, ${n * (Store.manifest.picks_per_entry || 5)} picks</span></div>
      <div><b>${tally("W")}</b><span>picks already won</span></div>
      <div><b>${tally("L")}</b><span>picks already lost</span></div>
      <div><b>${live}</b><span>picks still in play</span></div>
    </div>
    <p class="note">Every team on the week ${w} card, most picked first. Select a row to see which entries took it.</p>
    <div class="table-wrap"><table><thead><tr><th>Team</th><th>Line</th><th>Opponent</th><th class="num">Entries</th>
      <th class="num">% of field</th><th>Score</th><th>Status</th><th class="num">Field pts</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="name"><button data-team="${esc(r.abbr)}">${lbl(r.abbr)} ${nickOf(r.abbr)}${r.home ? "" : " (away)"}</button></td>
        <td class="rec">${fmtLine(r.line)}</td><td class="rec">${lbl(r.opp)}</td>
        <td class="num">${r.who.length}</td><td class="num">${Math.round(r.who.length / n * 100)}%</td>
        ${cell(r)}<td class="num">${r.pts == null ? "\u2014" : fmtPts(r.pts)}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function openTeam(abbr) {
  const w = S.week, card = Store.get(P.card(w)).games, picks = Store.get(P.picks(w))?.entries || [];
  const scores = scoresMap(w), ov = Store.get(P.scores(w))?.overrides || {};

      `<button class="chip" data-entry="${esc(id)}" style="min-width:0;margin:0 4px 4px 0;cursor:pointer">${esc(id)}</button>`).join("")}</p></div>`;

/* ================= season data ================= */
// Load every week's card, picks and scores (current week stays live; others read once).
function seasonReady(kinds, upTo = 99) {
  const idx = index().weeks; let ready = true;
  for (const w of weeksList().filter(w => w <= upTo)) for (const k of kinds) {
    if (!idx[w]?.[k]) continue;
    const path = P[k](w);
    if (!Store.cache.has(path)) { ready = false; Store.fetchOnce(path, render); }
  }
  return ready;
}
function weekGrades(w) {
  const card = Store.get(P.card(w))?.games; if (!card) return null;
  return { card, scores: scoresMap(w), ov: Store.get(P.scores(w))?.overrides || {} };
}

/* ================= render: teams ATS ================= */
function renderAts() {
  const el = $("#ats");
  if (!seasonReady(["card", "picks", "scores"])) { el.innerHTML = `<p class="note">Loading the season…</p>`; return; }
  const weeks = weeksList().filter(w => index().weeks[w]?.card);
  if (!weeks.length) { el.innerHTML = `<div class="empty"><b>No game sheets uploaded yet.</b></div>`; return; }
  const T = {};
  const teamList = isCollege()
    ? [...new Set(weeks.flatMap(w => (Store.get(P.card(w))?.games || []).flatMap(g => [g.fav.abbr, g.dog.abbr])))]
    : Object.keys(NICK);
  for (const ab of teamList) T[ab] = { ab, w: 0, l: 0, p: 0, marg: 0, n: 0, hw: 0, hl: 0, aw: 0, al: 0, fw: 0, fl: 0, dw: 0, dl: 0, picks: 0, pw: 0, pl: 0, weeks: {} };
  const L = { favW: 0, favL: 0, homeW: 0, homeL: 0 };
  for (const w of weeks) {
    const g = weekGrades(w);
    const cnt = {}; (Store.get(P.picks(w))?.entries || []).forEach(e => e.picks.forEach(a => cnt[a] = (cnt[a] || 0) + 1));
    for (const gm of g.card) for (const side of [gm.fav, gm.dog]) {
      const t = T[side.abbr]; if (!t) continue;
      const gr = grade(side.abbr, g.card, g.scores, g.ov);
      const opp = side === gm.fav ? gm.dog : gm.fav;
      t.weeks[w] = { line: side.line, opp: opp.abbr, home: side.home, gr };
      t.picks += cnt[side.abbr] || 0;
      if (!gr.final || !gr.res) continue;
      const r = gr.res;
      if (r === "W") t.w++; else if (r === "L") t.l++; else t.p++;
      if (gr.mine != null) { t.marg += gr.mine + side.line - gr.theirs; t.n++; }
      if (r === "W" || r === "L") {
        const k = r === "W" ? "w" : "l";
        t[(side.home ? "h" : "a") + k]++;
        if (side.line < 0) t["f" + k]++; else if (side.line > 0) t["d" + k]++;
        if (side === gm.fav && side.line < 0) L[r === "W" ? "favW" : "favL"]++;
        if (side.home) L[r === "W" ? "homeW" : "homeL"]++;
        if (r === "W") t.pw += cnt[side.abbr] || 0; else t.pl += cnt[side.abbr] || 0;
      }
    }
  }
  const pct = t => t.w + t.l ? t.w / (t.w + t.l) : -1;
  const key = { team: t => t.ab, pct: pct, marg: t => t.n ? t.marg / t.n : -99, picks: t => t.picks }[S.atsSort || "pct"];
  const rows = Object.values(T).sort((a, b) => {
    const A = key(a), B = key(b);
    return (typeof A === "string" ? A.localeCompare(B) : B - A) * (S.atsDir || 1) || pct(b) - pct(a) || a.ab.localeCompare(b.ab);
  });
  const rec = (w, l) => w + l ? `${w}-${l}` : "—";
  const th = (k, t, cls = "") => `<th class="${cls}" data-atssort="${k}" style="cursor:pointer" ${S.atsSort === k || (!S.atsSort && k === "pct") ? `aria-sort="descending"` : ""}>${t}</th>`;
  const wkCell = x => {
    if (!x) return `<td class="wk">—</td>`;
    const r = x.gr, cls = r.res ? `st-${r.res}${r.final ? "" : " live"}` : "";
    const sc = r.mine != null ? `${r.mine}-${r.theirs}` : r.postponed ? "PPD" : "";
    return `<td class="wk"><span class="cnt ${cls}" style="min-width:44px">${fmtLine(x.line)}</span><small>${x.home ? "vs" : "@"} ${lbl(x.opp)}${sc ? " " + sc : ""}</small></td>`;
  };
  el.innerHTML = `
    <div class="strip">
      <div><b>${rec(L.favW, L.favL)}</b><span>favorites ATS</span></div>
      <div><b>${rec(L.homeW, L.homeL)}</b><span>home teams ATS</span></div>
      <div><b>${weeks.length}</b><span>week${weeks.length > 1 ? "s" : ""} on file (${weeks.map(w => "W" + w).join(", ")})</span></div>
    </div>
    <p class="note">Against the Westgate contest line, final games only. Green = covered, red = didn't, amber = push. Dashed = in progress. "Field" is how the contest entries did when they picked that team.</p>
    <div class="table-wrap"><table style="min-width:${720 + weeks.length * 70}px"><thead><tr>
      ${th("team", "Team")}<th>ATS</th>${th("pct", "Cover %", "num")}${th("marg", "Avg vs line", "num")}
      <th>Home</th><th>Away</th><th>As fav</th><th>As dog</th>
      ${weeks.map(w => `<th>W${w}</th>`).join("")}${th("picks", "Field picks", "num")}<th>Field W-L</th></tr></thead><tbody>
      ${rows.map(t => `<tr><td class="name"><b>${lbl(t.ab)}</b> <small class="note">${nickOf(t.ab)}</small></td>
        <td class="rec">${t.w}-${t.l}${t.p ? "-" + t.p : ""}</td>
        <td class="num">${pct(t) < 0 ? "—" : Math.round(pct(t) * 100) + "%"}</td>
        <td class="num">${t.n ? (t.marg / t.n > 0 ? "+" : "") + (t.marg / t.n).toFixed(1) : "—"}</td>
        <td class="rec">${rec(t.hw, t.hl)}</td><td class="rec">${rec(t.aw, t.al)}</td><td class="rec">${rec(t.fw, t.fl)}</td><td class="rec">${rec(t.dw, t.dl)}</td>
        ${weeks.map(w => wkCell(t.weeks[w])).join("")}
        <td class="num">${t.picks}</td><td class="rec">${t.pw + t.pl ? `${t.pw}-${t.pl}` : "—"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note" style="margin-top:10px">Avg vs line = points by which the team beat (+) or missed (−) the spread, averaged over its final games. A bye week shows as —.</p>`;
}

/* ================= render: top entries ================= */
// Leaders are ranked by standings ENTERING the selected week (through the week before),
// so the breakdown shows what the leaders picked, not who happened to win this week.
function topGroup(W) {
  const basis = S.topBasis || "entering";
  const rankWeek = basis === "entering" ? W - 1 : W;
  if (rankWeek < 1) return { none: true, rankWeek };
  const st = computeStandings(rankWeek);
  if (!st.list.length) return { none: true, rankWeek };
  const N = Math.min(Math.max(1, S.topN || 10), st.list.length);
  const cut = st.list[N - 1].total;
  const tied = st.list.slice(N).filter(r => r.total === cut).length;
  const group = S.topTies !== false ? st.list.filter((r, i) => i < N || r.total === cut) : st.list.slice(0, N);
  return { st, rankWeek, N, cut, tied, group, basis };
}
function renderTop() {
  const el = $("#top"), W = S.week;
  if (!seasonReady(["card", "picks", "scores", "standings"], W)) { el.innerHTML = `<p class="note">Loading the season…</p>`; return; }
  const T = topGroup(W);
  const controls = `
    <div class="topctl">
      <label for="topN">Standings 1 to</label>
      <input id="topN" type="number" inputmode="numeric" min="1" value="${S.topN || 10}">
      ${[5, 10, 25, 50].map(k => `<button class="pill" data-topn="${k}" aria-pressed="${(S.topN || 10) === k}">Top ${k}</button>`).join("")}
    </div>
    <div class="topctl">
      <label style="font-weight:400"><input type="checkbox" id="topTies" ${S.topTies !== false ? "checked" : ""}> Include everyone tied at the cutoff</label>
      <label style="font-weight:400">Rank by
        <select id="topBasis" class="week" style="font-size:15px;padding:4px 8px">
          <option value="entering" ${T.basis !== "live" ? "selected" : ""}>standings entering week ${W}</option>
          <option value="live" ${T.basis === "live" ? "selected" : ""}>live standings including week ${W}</option>
        </select></label>
    </div>`;
  if (T.none) {
    el.innerHTML = controls + `<div class="empty"><b>No standings before week ${W}.</b> Everyone starts week 1 at zero, so there are no leaders yet. Pick week 2 or later, or rank by live standings.</div>`;
    return;
  }
  const picks = Store.get(P.picks(W))?.entries;
  const g = weekGrades(W);
  if (!picks || !g) { el.innerHTML = controls + `<div class="empty"><b>Week ${W} picks aren't uploaded yet.</b> Once the selections PDF is in, this shows what the leaders took.</div>`; return; }
  const byId = Object.fromEntries(picks.map(e => [e.id, e.picks]));
  const members = T.group;
  const withPicks = members.filter(r => byId[r.id]);
  const count = {}, who = {};
  for (const r of withPicks) for (const a of byId[r.id]) { count[a] = (count[a] || 0) + 1; (who[a] ||= []).push(r.id); }
  const fieldCnt = {}; picks.forEach(e => e.picks.forEach(a => fieldCnt[a] = (fieldCnt[a] || 0) + 1));
  S.topWho = who;
  const n = withPicks.length;
  const rows = Object.entries(count).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const maxC = rows.length ? rows[0][1] : 1;
  const status = gr => gr.postponed ? "Postponed" : !gr.res ? "Not started" : gr.final ? RESULT_TEXT[gr.res] : { W: "Covering", L: "Not covering", P: "On the number" }[gr.res];
  const range = T.group.length > T.N ? `1–${T.N}, plus ${T.group.length - T.N} tied at ${fmtPts(T.cut)} points` : `1–${T.N}`;
  const basisTxt = T.basis === "live" ? `live standings through week ${W}` : `${T.st.official ? "official" : "live"} standings after week ${T.rankWeek}`;
  el.innerHTML = controls + `
    <p class="note"><b>${T.group.length} entries</b> (standings ${range}), ranked by ${basisTxt}.
      ${!T.group.length || S.topTies !== false || !T.tied ? "" : `${T.tied} more ${T.tied === 1 ? "entry is" : "entries are"} tied at ${fmtPts(T.cut)} points and left out.`}
      ${n < T.group.length ? `${T.group.length - n} of them submitted no week ${W} picks.` : ""}</p>
    <h2 class="sec">Week ${W}: teams picked by the leaders</h2>
    <div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Team</th><th>Line</th><th>Opp</th>
      <th style="width:34%">Leaders who picked it</th><th class="num">% of leaders</th><th class="num">% of field</th><th>Result</th></tr></thead><tbody>
    ${rows.map(([a, k]) => { const gr = grade(a, g.card, g.scores, g.ov); return `<tr>
      <td class="name"><button data-topteam="${esc(a)}">${lbl(a)} ${nickOf(a)}</button></td>
      <td class="rec">${fmtLine(gr.side?.line ?? 0)}</td><td class="rec">${gr.side?.home ? "vs" : "@"} ${gr.opp ? lbl(gr.opp.abbr) : ""}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><b style="font:700 18px var(--cond);min-width:22px">${k}</b>
        <div style="flex:1;height:10px;border-radius:5px;background:var(--panel-2)"><div style="height:100%;width:${k / maxC * 100}%;border-radius:5px;background:var(--ink-2)"></div></div></div></td>
      <td class="num">${Math.round(k / n * 100)}%</td><td class="num">${Math.round((fieldCnt[a] || 0) / picks.length * 100)}%</td>
      <td><span class="chip ${gr.res ? "st-" + gr.res + (gr.final ? "" : " live") : ""}">${status(gr)}</span></td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note" style="margin-top:8px">Select a team to see which leaders took it.</p>
    <h2 class="sec">The leaders' week ${W} picks</h2>
    <div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Place</th><th>Entry</th><th class="num">Points</th><th>Week ${W} picks</th></tr></thead><tbody>
    ${T.group.map(r => `<tr><td class="place">${r.place}${r.tie ? "T" : ""}</td>
      <td class="name"><button data-entry="${esc(r.id)}">${esc(r.id)}</button></td><td class="num">${fmtPts(r.total)}</td>
      <td>${byId[r.id] ? `<div class="picks">${byId[r.id].map(a => chip(grade(a, g.card, g.scores, g.ov), true)).join("")}</div>` : `<span class="note">No picks</span>`}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* ================= shell ================= */
function renderStatus() {

  const live = Object.values(d?.games || {}).some(g => g.state === "in");
  const t = d?.updated ? new Date(d.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";

  $("#status").innerHTML = `<span class="pulse ${live ? "on" : ""}"></span>${live ? "Games in progress. " : ""}${src}`;

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    for (const t of ["games", "standings", "teams", "ats", "top", "data"]) $("#" + t).hidden = S.tab !== t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
    const focus = document.activeElement?.id === "q" ? $("#q").selectionStart : null;
    if (S.tab === "games") renderGames(); else if (S.tab === "standings") renderStandings();
    else if (S.tab === "teams") renderTeams(); else if (S.tab === "ats") renderAts();
    else if (S.tab === "top") renderTop(); else renderData();
    if (focus !== null && $("#q")) { $("#q").focus(); $("#q").setSelectionRange(focus, focus); }
    renderStatus();
  });
}
function onIndex() {
  const ws = weeksList();
  const withCard = ws.filter(w => index().weeks[w]?.card);
  if (S.week == null || !ws.includes(S.week)) S.week = withCard.at(-1) ?? ws.at(-1) ?? null;
  $("#week").innerHTML = ws.length ? ws.map(w => `<option value="${w}" ${w === S.week ? "selected" : ""}>Week ${w}</option>`).join("") : `<option>No data</option>`;
  if (S.week != null) {
    const { set } = neededPaths(S.week);
    Store.unwatchExcept(set);
    for (const p of set) Store.watch(p, p === P.index ? () => { onIndex(); } : render);
  }
  if (!ws.length && S.tab !== "data") S.tab = "data";
  render();
}
function markLeague() {
  document.querySelectorAll("[data-league]").forEach(b => b.setAttribute("aria-pressed", b.dataset.league === S.league));
  document.title = `Contest Board: ${S.league === "ncaaf" ? "NCAAF" : "NFL"}`;
}
async function switchLeague(lg) {
  if (lg === S.league) return;
  S.league = lg; local.set("cb-league", lg); markLeague();
  history.replaceState(null, "", lg === "ncaaf" ? "#lg=ncaaf" : location.pathname + location.search);
  S.week = null; S.shown = 150; S.q = "";
  ["games", "standings", "teams", "ats", "top"].forEach(t => { const el = $("#" + t); if (el) el.innerHTML = `<p class="note">Loading…</p>`; });
  await Store.reset();
  Store.watch(P.index, onIndex);
  setTimeout(scheduleRefresh, 1500);
}
function bind() {
  document.querySelector(".league").addEventListener("click", e => { const b = e.target.closest("[data-league]"); if (b) switchLeague(b.dataset.league); });
  $("#week").addEventListener("change", e => { S.week = +e.target.value; S.shown = 150; onIndex(); setTimeout(scheduleRefresh, 1500); });
  document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { S.tab = b.dataset.tab; render(); } });
  const main = $("#main");
  main.addEventListener("click", e => {
    const t = e.target, c = s => t.closest(s);
    if (c("[data-gsort]")) { S.gameSort = c("[data-gsort]").dataset.gsort; render(); }
    else if (c("[data-star]")) { const id = c("[data-star]").dataset.star; S.starred.has(id) ? S.starred.delete(id) : S.starred.add(id); local.set("cb-starred", [...S.starred]); render(); }
    else if (c("[data-entry]")) openEntry(c("[data-entry]").dataset.entry);
    else if (c("[data-team]")) openTeam(c("[data-team]").dataset.team);
    else if (c("[data-atssort]")) { const k = c("[data-atssort]").dataset.atssort; S.atsDir = (S.atsSort || "pct") === k ? -(S.atsDir || 1) : (k === "team" ? -1 : 1); S.atsSort = k; render(); }
    else if (c("[data-topn]")) { S.topN = +c("[data-topn]").dataset.topn; local.set("cb-topn", S.topN); render(); }
    else if (c("[data-topteam]")) openTopTeam(c("[data-topteam]").dataset.topteam);
    else if (c("th[data-sort]")) {
      const k = c("th[data-sort]").dataset.sort;
      if (S.sortKey === k) S.sortDir = -S.sortDir; else { S.sortKey = k; S.sortDir = k === "name" ? 1 : -1; }
      render();
    }
    else if (t.id === "more") { S.shown = Infinity; render(); }
  });
  main.addEventListener("input", e => {
    if (e.target.id === "topN") {
      const v = parseInt(e.target.value, 10);
      if (v > 0) { S.topN = v; local.set("cb-topn", v); clearTimeout(S.tnT); S.tnT = setTimeout(() => { render(); requestAnimationFrame(() => { const i = $("#topN"); if (i) { i.focus(); const l = i.value.length; try { i.setSelectionRange(l, l); } catch {} } }); }, 350); }
      return;
    }
    if (e.target.id === "q") { S.q = e.target.value; S.shown = 150; clearTimeout(S.qT); S.qT = setTimeout(render, 150); } });
  main.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "onlyStar") { S.onlyStarred = t.checked; render(); }
    else if (t.id === "topTies") { S.topTies = t.checked; render(); }
    else if (t.id === "topBasis") { S.topBasis = t.value; render(); }
  });
  $("#entry").addEventListener("click", e => {
    const en = e.target.closest("[data-entry]");
    if (en) { $("#entry").close(); openEntry(en.dataset.entry); return; }
    if (e.target.matches("[data-close]") || e.target === $("#entry")) $("#entry").close();
  });
}

bind();
renderStatus();
markLeague();
Store.init().then(() => { Store.watch(P.index, onIndex); setTimeout(scheduleRefresh, 3000); });
})();
</script>
</body>
</html>
