name: Update contest data

on:
  schedule:
    # Every 15 min (UTC). GitHub can delay scheduled runs; the page pulls
    # live scores itself, so this mainly picks up new PDFs and saves finals.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "Only this week (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
            - name: Install OCR (Circa Million spreads sheet has no text layer)
        run: sudo apt-get install -y -qq --no-install-recommends tesseract-ocr > /dev/null
      - name: Scrape Westgate + ESPN
        id: scrape
        continue-on-error: true
        run: python -m scraper.scrape ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
      - name: Commit changes
        run: |
          git config user.name "contest-bot"
          git config user.email "contest-bot@users.noreply.github.com"
          git add docs/data
          if [ -d raw ]; then git add raw; fi
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)" && git push
          fi
      - name: Flag parse problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::Scraper reported a problem (a PDF failed to download or parsed too few rows). Check the log above and raw/ text files."
          exit 1
